<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>word2md - 多格式文件轉 Markdown 工具</title>
  <!-- Google Fonts: Outfit for headings, Inter for body -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- JSZip (for Client-side ODT & ZIP decompression/packaging) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- Turndown & GFM Plugin (for HTML to Markdown) -->
  <script src="https://unpkg.com/turndown/dist/turndown.js"></script>
  <script src="https://unpkg.com/turndown-plugin-gfm/dist/turndown-plugin-gfm.js"></script>

  <!-- Mammoth.js (for Client-side DOCX to HTML) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.8.0/mammoth.browser.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="./assets/css/style.css">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M14 4 L60 4 L86 30 L86 86 A10 10 0 0 1 76 96 L14 96 A10 10 0 0 1 4 86 L4 14 A10 10 0 0 1 14 4 Z' fill='%232563eb'/%3E%3Cpath d='M60 4 L60 22 A8 8 0 0 0 68 30 L86 30 Z' fill='%2360a5fa'/%3E%3Cpath d='M20 72 L20 38 L33 38 L45 54 L57 38 L70 38 L70 60 L78 60 L63.5 78 L49 60 L57 60 L57 48 L45 64 L33 48 L33 72 Z' fill='%23ffffff'/%3E%3Cpath d='M23 69 L23 41 L32 41 L45 56 L58 41 L67 41 L67 58 L74 58 L63.5 72 L53 58 L60 58 L60 47 L45 65 L30 47 L30 69 Z' fill='%2306b6d4'/%3E%3C/svg%3E">
</head>
<body>
  <div class="app-container">
    <!-- Header -->
    <header class="app-header">
      <div class="logo-area">
        <div class="logo-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="app-logo" width="36" height="36">
            <defs>
              <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#3b82f6"/>
                <stop offset="100%" stop-color="#1d4ed8"/>
              </linearGradient>
              <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#38bdf8"/>
                <stop offset="100%" stop-color="#06b6d4"/>
              </linearGradient>
              <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#60a5fa"/>
                <stop offset="100%" stop-color="#2563eb"/>
              </linearGradient>
            </defs>
            <!-- 文件主體 -->
            <path d="M 14 4 L 60 4 L 86 30 L 86 86 A 10 10 0 0 1 76 96 L 14 96 A 10 10 0 0 1 4 86 L 4 14 A 10 10 0 0 1 14 4 Z" fill="url(#docGrad)"/>
            <!-- 文件折角 -->
            <path d="M 60 4 L 60 22 A 8 8 0 0 0 68 30 L 86 30 Z" fill="url(#foldGrad)"/>
            <path d="M 60 22 L 68 30 L 60 30 Z" fill="#1e3a8a" opacity="0.4"/>
            <!-- Markdown M↓ 標誌 -->
            <path d="M 20 72 L 20 38 L 33 38 L 45 54 L 57 38 L 70 38 L 70 60 L 78 60 L 63.5 78 L 49 60 L 57 60 L 57 48 L 45 64 L 33 48 L 33 72 Z" fill="#ffffff"/>
            <path d="M 23 69 L 23 41 L 32 41 L 45 56 L 58 41 L 67 41 L 67 58 L 74 58 L 63.5 72 L 53 58 L 60 58 L 60 47 L 45 65 L 30 47 L 30 69 Z" fill="url(#cyanGrad)"/>
          </svg>
        </div>
        <div class="logo-text">
          <h1>word<span>2md</span></h1>
        </div>
      </div>
      <div class="header-actions">
        <div class="format-selector">
          <span class="label">輸出格式</span>
          <div class="select-wrapper">
            <select id="output-format">
              <option value="md" selected>Markdown (.md)</option>
            </select>
            <i data-lucide="chevron-down" class="select-arrow"></i>
          </div>
        </div>
      </div>
    </header>

    <div class="app-content">
      <!-- Left Panel: Upload & History -->
      <aside class="sidebar">
        <!-- Upload Card -->
        <div class="glass-card upload-card">
          <div class="card-header">
            <i data-lucide="upload-cloud"></i>
            <h2>上傳文件檔案</h2>
          </div>
          
          <div class="drop-zone" id="drop-zone">
            <div class="drop-zone-content">
              <div class="drop-zone-icon">
                <i data-lucide="file-up"></i>
              </div>
              <h3>將檔案拖曳至此</h3>
              <p>支援 .docx、.odt、.html、.zip</p>
              <span class="file-limit">純前端本機解析，檔案不經伺服器</span>
            </div>
            <input type="file" id="file-input" accept=".docx,.odt,.html,.htm,.zip" style="display: none;">
          </div>

          <div class="selected-file-info" id="selected-file-info" style="display: none;">
            <div class="file-details">
              <i data-lucide="file" class="file-icon"></i>
              <div class="file-meta">
                <span class="file-name" id="display-file-name">document.odt</span>
                <span class="file-size" id="display-file-size">1.2 MB</span>
              </div>
            </div>
            <button class="btn btn-primary" id="btn-convert">
              <span>開始轉換</span>
              <i data-lucide="arrow-right"></i>
            </button>
          </div>
        </div>

        <!-- History Card -->
        <div class="glass-card history-card">
          <div class="card-header history-header">
            <div class="header-title">
              <i data-lucide="history"></i>
              <h2>轉換歷史記錄</h2>
            </div>
            <button class="btn-clean-history" id="btn-clean-history" title="清空歷史紀錄" style="display: none;">
              <i data-lucide="trash-2"></i>
              <span>清空紀錄</span>
            </button>
          </div>
          <div class="history-list" id="history-list">
            <div class="empty-history">
              <i data-lucide="inbox"></i>
              <p>尚無轉換記錄</p>
            </div>
          </div>
        </div>
      </aside>

      <!-- Right Panel: Preview Area -->
      <main class="main-panel">
        <div class="glass-card preview-card">
          <!-- Control bar for preview -->
          <div class="preview-header">
            <div class="preview-tabs">
              <button class="tab-btn active" data-tab="rendered">
                <i data-lucide="eye"></i>
                排版預覽
              </button>
              <button class="tab-btn" data-tab="raw">
                <i data-lucide="code"></i>
                Markdown 原始碼
              </button>
            </div>
            
            <div class="preview-actions">
              <button class="btn btn-secondary" id="btn-copy" disabled>
                <i data-lucide="copy"></i>
                <span>複製內容</span>
              </button>
              <button class="btn btn-primary" id="btn-download-zip" disabled>
                <i data-lucide="download"></i>
                <span>下載 ZIP</span>
              </button>
              <button class="btn btn-secondary" id="btn-download-md" disabled>
                <i data-lucide="file-down"></i>
                <span>下載 .md</span>
              </button>
            </div>
          </div>

          <!-- Preview Content -->
          <div class="preview-body">
            <!-- Loading Indicator -->
            <div class="loader-container" id="loader" style="display: none;">
              <div class="spinner"></div>
              <h3>正在轉換文件...</h3>
              <p>處理中，請稍候</p>
            </div>

            <!-- Welcome Screen -->
            <div class="welcome-screen" id="welcome-screen">
              <div class="welcome-illustration">
                <i data-lucide="refresh-cw" class="spin-slow"></i>
              </div>
              <h2>尚未選擇文件</h2>
              <p>請從左側上傳 DOCX、ODT、HTML 或 ZIP 檔案，轉換後將在此顯示預覽與 Markdown 內容</p>
            </div>

            <!-- Output Info Panel (Stats) -->
            <div class="output-info-bar" id="output-info-bar" style="display: none;">
              <div class="info-stat">
                <span class="stat-label">目前檔案</span>
                <span class="stat-value" id="info-path">-</span>
              </div>
              <div class="info-stat">
                <span class="stat-label">擷取圖片數</span>
                <span class="stat-value" id="info-images">0 張</span>
              </div>
            </div>

            <!-- Rendered Markdown Preview -->
            <div class="tab-content active" id="tab-rendered" style="display: none;">
              <div class="markdown-body" id="markdown-rendered">
                <!-- HTML rendered preview will go here -->
              </div>
            </div>

            <!-- Raw Markdown Code -->
            <div class="tab-content" id="tab-raw" style="display: none;">
              <textarea class="markdown-raw" id="markdown-raw" readonly placeholder="Markdown 程式碼將顯示於此..."></textarea>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Notification Toast -->
  <div class="toast" id="toast">
    <i data-lucide="info" class="toast-icon"></i>
    <span class="toast-message">提示訊息</span>
  </div>

  <!-- Main Clean Code ESM Bootstrapper -->
  <script type="module" src="./src/index.js"></script>
</body>
</html>
